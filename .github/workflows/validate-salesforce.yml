name: Validate Salesforce Changes

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: salesforce-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Against Sandbox
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-latest
    timeout-minutes: 150

    environment:
      name: validation

    steps:
      ###############################################################
      # 1. Checkout source code and full Git history
      ###############################################################
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      ###############################################################
      # 2. Validate required version variables
      ###############################################################
      - name: Check Required Variables
        shell: bash
        env:
          SF_CLI_VERSION: ${{ vars.SF_CLI_VERSION }}
          SGD_VERSION: ${{ vars.SGD_VERSION }}
        run: |
          set -euo pipefail

          if [ -z "$SF_CLI_VERSION" ]; then
            echo "Repository variable SF_CLI_VERSION is not configured."
            exit 1
          fi

          if [ -z "$SGD_VERSION" ]; then
            echo "Repository variable SGD_VERSION is not configured."
            exit 1
          fi

      ###############################################################
      # 3. Install Node.js
      ###############################################################
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      ###############################################################
      # 4. Install pinned Salesforce CLI version
      ###############################################################
      - name: Install Salesforce CLI
        shell: bash
        env:
          SF_CLI_VERSION: ${{ vars.SF_CLI_VERSION }}
        run: |
          set -euo pipefail

          npm install --global "@salesforce/cli@${SF_CLI_VERSION}"
          sf --version

      ###############################################################
      # 5. Install pinned SFDX Git Delta version
      ###############################################################
      - name: Install SFDX Git Delta
        shell: bash
        env:
          SGD_VERSION: ${{ vars.SGD_VERSION }}
        run: |
          set -euo pipefail

          echo y | sf plugins install "sfdx-git-delta@${SGD_VERSION}"
          sf plugins

      ###############################################################
      # 6. Re-create temporary JWT private key
      ###############################################################
      - name: Create JWT Key
        shell: bash
        env:
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$SF_JWT_KEY" ]; then
            echo "Environment secret SF_JWT_KEY is not configured."
            exit 1
          fi

          umask 077
          printf '%s' "$SF_JWT_KEY" > server.key
          chmod 600 server.key

          test -s server.key

      ###############################################################
      # 7. Authenticate to validation sandbox/UAT
      ###############################################################
      - name: Authenticate Validation Org
        shell: bash
        env:
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
        run: |
          set -euo pipefail

          if [ -z "$SF_CLIENT_ID" ] ||
             [ -z "$SF_USERNAME" ] ||
             [ -z "$SF_INSTANCE_URL" ]; then
            echo "One or more Salesforce validation secrets are missing."
            exit 1
          fi

          sf org login jwt \
            --client-id "$SF_CLIENT_ID" \
            --jwt-key-file server.key \
            --username "$SF_USERNAME" \
            --instance-url "$SF_INSTANCE_URL" \
            --alias validation-org

      ###############################################################
      # 8. Confirm authentication without printing secrets
      ###############################################################
      - name: Verify Validation Connection
        shell: bash
        run: |
          set -euo pipefail

          sf org display \
            --target-org validation-org \
            --json > validation-org.json

          echo "Validation org authentication succeeded."

      ###############################################################
      # 9. Generate delta between PR base and PR head
      ###############################################################
      - name: Generate Pull Request Delta
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          echo "Generating delta for Pull Request commits."

          mkdir -p delta

          sf sgd source delta \
            --from "$BASE_SHA" \
            --to "$HEAD_SHA" \
            --output-dir delta

      ###############################################################
      # 10. Display generated manifests for review
      ###############################################################
      - name: Display Generated Manifests
        shell: bash
        run: |
          set -euo pipefail

          echo "Generated files:"
          find delta -type f -print || true

          echo "Regular deployment manifest:"
          if [ -f delta/package/package.xml ]; then
            cat delta/package/package.xml
          else
            echo "No regular package manifest was generated."
          fi

          echo "Destructive changes manifest:"
          if [ -f delta/destructiveChanges/destructiveChanges.xml ]; then
            cat delta/destructiveChanges/destructiveChanges.xml
          else
            echo "No destructive changes manifest was generated."
          fi

      ###############################################################
      # 11. Validate delta without changing the org
      ###############################################################
      - name: Validate Delta Deployment
        shell: bash
        run: |
          set -euo pipefail

          echo "Current Salesforce project directory:"
          pwd

          if [! -f sfdx-project.json ]; then
            echo "ERROR: sfdx-project.json was not found in:"
            pwd

            echo "Available files:"
            ls -la

            exit 1
          fi

          HAS_PACKAGE=false
          HAS_DESTRUCTIVE=false

          if [ -f delta/package/package.xml ] &&
            grep -q "<types>" delta/package/package.xml; then
            HAS_PACKAGE=true
          fi

          if [ -f delta/destructiveChanges/destructiveChanges.xml ] &&
            grep -q "<types>" delta/destructiveChanges/destructiveChanges.xml; then
            HAS_DESTRUCTIVE=true
          fi

          echo "Has regular metadata: $HAS_PACKAGE"
          echo "Has destructive metadata: $HAS_DESTRUCTIVE"

          if [ "$HAS_PACKAGE" = "false" ] &&
            [ "$HAS_DESTRUCTIVE" = "false" ]; then
            echo "No Salesforce metadata changes were found."
            exit 0
          fi

          if [ "$HAS_PACKAGE" = "true" ]; then
            MANIFEST="delta/package/package.xml"
          else
            MANIFEST="delta/destructiveChanges/package.xml"
          fi

          if [! -f "$MANIFEST" ]; then
            echo "ERROR: Deployment manifest was not found: $MANIFEST"
            exit 1
          fi

          echo "Manifest selected: $MANIFEST"

          DEPLOY_COMMAND=(
            sf project deploy start
            --target-org validation-org
            --manifest "$MANIFEST"
            --test-level RunLocalTests
            --dry-run
            --wait 120
          )

          if [ "$HAS_DESTRUCTIVE" = "true" ]; then
            DEPLOY_COMMAND+=(
              --post-destructive-changes
              delta/destructiveChanges/destructiveChanges.xml
            )
          fi

          echo "Starting validation-only deployment."
          "${DEPLOY_COMMAND[@]}"
      ###############################################################
      # 12. Always remove temporary credentials
      ###############################################################
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f server.key
          rm -f validation-org.json