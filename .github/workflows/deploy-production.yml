name: Deploy Salesforce Production

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      deployment_mode:
        description: Select delta or full deployment
        required: true
        default: delta
        type: choice
        options:
          - delta
          - full

permissions:
  contents: read

concurrency:
  group: salesforce-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production

    runs-on: ubuntu-latest
    timeout-minutes: 150

    environment:
      name: production

    steps:
      ###############################################################
      # 1. Checkout source and complete Git history
      ###############################################################
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      ###############################################################
      # 2. Validate required repository variables
      ###############################################################
      - name: Check Required Variables
        shell: bash
        env:
          SF_CLI_VERSION: ${{ vars.SF_CLI_VERSION }}
          SGD_VERSION: ${{ vars.SGD_VERSION }}
        run: |
          set -euo pipefail

          if [ -z "$SF_CLI_VERSION" ]; then
            echo "Repository variable SF_CLI_VERSION is not configured."
            exit 1
          fi

          if [ -z "$SGD_VERSION" ]; then
            echo "Repository variable SGD_VERSION is not configured."
            exit 1
          fi

      ###############################################################
      # 3. Determine delta or full deployment
      ###############################################################
      - name: Determine Deployment Mode
        id: deployment_mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ github.event.inputs.deployment_mode }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          ZERO_SHA="0000000000000000000000000000000000000000"

          if [ "$EVENT_NAME" = "workflow_dispatch" ] &&
             [ "$REQUESTED_MODE" = "full" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "Manual full deployment selected."
            exit 0
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "$ZERO_SHA" ]; then
              echo "mode=full" >> "$GITHUB_OUTPUT"
              echo "A valid previous commit was not provided."
              echo "Falling back to full deployment."
            else
              echo "mode=delta" >> "$GITHUB_OUTPUT"
              echo "from_sha=$BEFORE_SHA" >> "$GITHUB_OUTPUT"
              echo "to_sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
              echo "Push delta deployment selected."
            fi

            exit 0
          fi

          echo "mode=delta" >> "$GITHUB_OUTPUT"
          echo "from_sha=HEAD^" >> "$GITHUB_OUTPUT"
          echo "to_sha=HEAD" >> "$GITHUB_OUTPUT"
          echo "Manual delta deployment selected."

      ###############################################################
      # 4. Install Node.js
      ###############################################################
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      ###############################################################
      # 5. Install pinned Salesforce CLI version
      ###############################################################
      - name: Install Salesforce CLI
        shell: bash
        env:
          SF_CLI_VERSION: ${{ vars.SF_CLI_VERSION }}
        run: |
          set -euo pipefail

          npm install --global "@salesforce/cli@${SF_CLI_VERSION}"
          sf --version

      ###############################################################
      # 6. Install SGD only for delta deployment
      ###############################################################
      - name: Install SFDX Git Delta
        if: steps.deployment_mode.outputs.mode == 'delta'
        shell: bash
        env:
          SGD_VERSION: ${{ vars.SGD_VERSION }}
        run: |
          set -euo pipefail

          echo y | sf plugins install "sfdx-git-delta@${SGD_VERSION}"
          sf plugins

      ###############################################################
      # 7. Re-create temporary JWT private key
      ###############################################################
      - name: Create JWT Key
        shell: bash
        env:
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$SF_JWT_KEY" ]; then
            echo "Production environment secret SF_JWT_KEY is missing."
            exit 1
          fi

          umask 077
          printf '%s' "$SF_JWT_KEY" > server.key
          chmod 600 server.key

          test -s server.key

      ###############################################################
      # 8. Authenticate to Production
      ###############################################################
      - name: Authenticate Production Org
        shell: bash
        env:
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
        run: |
          set -euo pipefail

          if [ -z "$SF_CLIENT_ID" ] ||
             [ -z "$SF_USERNAME" ] ||
             [ -z "$SF_INSTANCE_URL" ]; then
            echo "One or more Production Salesforce secrets are missing."
            exit 1
          fi

          sf org login jwt \
            --client-id "$SF_CLIENT_ID" \
            --jwt-key-file server.key \
            --username "$SF_USERNAME" \
            --instance-url "$SF_INSTANCE_URL" \
            --alias prod

      ###############################################################
      # 9. Verify Production authentication
      ###############################################################
      - name: Verify Production Connection
        shell: bash
        run: |
          set -euo pipefail

          sf org display \
            --target-org prod \
            --json > production-org.json

          echo "Production authentication succeeded."

      ###############################################################
      # 10. Generate delta package
      ###############################################################
      - name: Generate Production Delta
        if: steps.deployment_mode.outputs.mode == 'delta'
        shell: bash
        env:
          FROM_SHA: ${{ steps.deployment_mode.outputs.from_sha }}
          TO_SHA: ${{ steps.deployment_mode.outputs.to_sha }}
        run: |
          set -euo pipefail

          if [ -z "$FROM_SHA" ] || [ -z "$TO_SHA" ]; then
            echo "Delta commit range was not determined."
            exit 1
          fi

          mkdir -p delta

          sf sgd source delta \
            --from "$FROM_SHA" \
            --to "$TO_SHA" \
            --output-dir delta

      ###############################################################
      # 11. Show delta manifests before deployment
      ###############################################################
      - name: Display Production Delta
        if: steps.deployment_mode.outputs.mode == 'delta'
        shell: bash
        run: |
          set -euo pipefail

          echo "Generated delta files:"
          find delta -type f -print || true

          echo "Regular deployment manifest:"
          if [ -f delta/package/package.xml ]; then
            cat delta/package/package.xml
          else
            echo "No regular package manifest was generated."
          fi

          echo "Destructive changes manifest:"
          if [ -f delta/destructiveChanges/destructiveChanges.xml ]; then
            cat delta/destructiveChanges/destructiveChanges.xml
          else
            echo "No destructive changes manifest was generated."
          fi

      ###############################################################
      # 12. Deploy delta once, including destructive changes
      ###############################################################
      - name: Deploy Production Delta
        if: steps.deployment_mode.outputs.mode == 'delta'
        shell: bash
        run: |
          set -euo pipefail

          HAS_PACKAGE=false
          HAS_DESTRUCTIVE=false

          if [ -f delta/package/package.xml ] &&
             grep -q "<types>" delta/package/package.xml; then
            HAS_PACKAGE=true
          fi

          if [ -f delta/destructiveChanges/destructiveChanges.xml ] &&
             grep -q "<types>" delta/destructiveChanges/destructiveChanges.xml; then
            HAS_DESTRUCTIVE=true
          fi

          echo "Has regular metadata: $HAS_PACKAGE"
          echo "Has destructive metadata: $HAS_DESTRUCTIVE"

          if [ "$HAS_PACKAGE" = "false" ] &&
             [ "$HAS_DESTRUCTIVE" = "false" ]; then
            echo "No Salesforce metadata changes were found."
            exit 0
          fi

          if [ "$HAS_PACKAGE" = "true" ]; then
            MANIFEST="delta/package/package.xml"
          else
            MANIFEST="delta/destructiveChanges/package.xml"
          fi

          DEPLOY_COMMAND=(
            sf project deploy start
            --target-org prod
            --manifest "$MANIFEST"
            --test-level RunLocalTests
            --wait 120
          )

          if [ "$HAS_DESTRUCTIVE" = "true" ]; then
            DEPLOY_COMMAND+=(
              --post-destructive-changes
              delta/destructiveChanges/destructiveChanges.xml
            )
          fi

          echo "Starting Production delta deployment."
          "${DEPLOY_COMMAND[@]}"

      ###############################################################
      # 13. Manual or fallback full deployment
      ###############################################################
      - name: Deploy Full Source
        if: steps.deployment_mode.outputs.mode == 'full'
        shell: bash
        run: |
          set -euo pipefail

          if [! -d force-app ]; then
            echo "The force-app directory does not exist."
            exit 1
          fi

          sf project deploy start \
            --target-org prod \
            --source-dir force-app \
            --test-level RunLocalTests \
            --wait 120

      ###############################################################
      # 14. Always remove temporary credentials
      ###############################################################
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f server.key
          rm -f production-org.json