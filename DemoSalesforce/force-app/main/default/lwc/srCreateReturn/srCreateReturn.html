<template>
    <lightning-quick-action-panel header="Tạo yêu cầu trả hàng">
        <template lwc:if={errorMessage}>
            <p class="slds-text-color_error">{errorMessage}</p>
        </template>

        <template lwc:if={info}>
            <!-- D.1 bước 1: thông tin đơn -->
            <div class="slds-grid slds-wrap slds-m-bottom_small">
                <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-3">Số đơn: <b>{info.orderNumber}</b></div>
                <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-3">Khách hàng: <b>{info.customerName}</b></div>
                <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-3">SĐT: {info.customerPhone}</div>
                <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-3">Ngày mua: {purchaseDateText}</div>
                <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-3">Ngày giao: {deliveryDateText}</div>
                <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-3">Cửa hàng bán: {info.storeName}</div>
            </div>

            <!-- D.1 bước 2, 3: bảng sản phẩm; dòng không trả được thì khóa và hiện lý do -->
            <div class="slds-scrollable_x">
                <table class="slds-table slds-table_bordered slds-table_cell-buffer slds-table_col-bordered">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th>Sản phẩm</th>
                            <th>SKU</th>
                            <th>Ngành hàng</th>
                            <th>SL mua</th>
                            <th>Đã trả</th>
                            <th>Hạn đổi trả</th>
                            <th>SL trả</th>
                            <th>Lý do</th>
                            <th>Tình trạng</th>
                            <th class="slds-text-align_right">Tiền hoàn</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={lines} for:item="line">
                            <tr key={line.key} class={line.rowClass}>
                                <td>
                                    <div>{line.productName}</div>
                                    <template lwc:if={line.blockReason}>
                                        <div class="slds-text-color_error slds-text-body_small">{line.blockReason}</div>
                                    </template>
                                    <template lwc:if={line.warning}>
                                        <div class="slds-text-color_error slds-text-body_small">{line.warning}</div>
                                    </template>
                                </td>
                                <td>{line.sku}</td>
                                <td>{line.family}</td>
                                <td>{line.purchasedQty}</td>
                                <td>{line.alreadyReturnedQty}</td>
                                <td>{line.deadlineText}</td>
                                <td style="min-width: 5rem">
                                    <lightning-input
                                        type="number"
                                        label="SL trả"
                                        variant="label-hidden"
                                        min="0"
                                        max={line.remainingQty}
                                        step="1"
                                        value={line.qty}
                                        disabled={line.disabled}
                                        data-id={line.orderItemId}
                                        onchange={handleQty}
                                    ></lightning-input>
                                </td>
                                <td style="min-width: 10rem">
                                    <lightning-combobox
                                        label="Lý do"
                                        variant="label-hidden"
                                        placeholder="Chọn"
                                        options={reasonOptions}
                                        value={line.reason}
                                        disabled={line.disabled}
                                        data-id={line.orderItemId}
                                        onchange={handleReason}
                                    ></lightning-combobox>
                                </td>
                                <td style="min-width: 10rem">
                                    <lightning-combobox
                                        label="Tình trạng"
                                        variant="label-hidden"
                                        placeholder="Chọn"
                                        options={conditionOptions}
                                        value={line.condition}
                                        disabled={line.disabled}
                                        data-id={line.orderItemId}
                                        onchange={handleCondition}
                                    ></lightning-combobox>
                                </td>
                                <td class="slds-text-align_right">{line.refundText}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <!-- D.1 bước 4: tổng tiền và cấp duyệt dự kiến -->
            <div class="slds-m-top_small slds-text-align_right">
                <div>Tổng tiền hoàn dự kiến: <b>{totalText}đ</b></div>
                <div>Cấp duyệt dự kiến: <b>{levelText}</b></div>
            </div>

            <template for:each={errorItems} for:item="err">
                <p key={err.key} class="slds-text-color_error">{err.text}</p>
            </template>
        </template>

        <div slot="footer">
            <lightning-button label="Đóng" onclick={handleClose}></lightning-button>
            <!-- D.1 bước 5: chỉ bật khi có ít nhất 1 dòng SL trả > 0 -->
            <lightning-button
                class="slds-m-left_x-small"
                variant="brand"
                label="Tạo yêu cầu"
                onclick={handleSubmit}
                disabled={submitDisabled}
            ></lightning-button>
        </div>
    </lightning-quick-action-panel>
</template>
