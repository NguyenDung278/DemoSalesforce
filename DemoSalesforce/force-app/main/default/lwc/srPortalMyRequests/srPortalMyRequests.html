<template>
    <lightning-card title={title}>
        <div class="slds-p-horizontal_medium">
            <template lwc:if={isGuest}>
                <p>Vui lòng đăng nhập để xem danh sách yêu cầu của bạn.</p>
            </template>
            <template lwc:else>
                <template lwc:if={errorMessage}>
                    <p class="slds-text-color_error">{errorMessage}</p>
                </template>
                <lightning-datatable
                    key-field="id"
                    data={rows}
                    columns={columns}
                    hide-checkbox-column
                    onrowaction={handleRowAction}
                ></lightning-datatable>
                <div class="slds-m-top_small">
                    <lightning-button label="Trang trước" onclick={prevPage} disabled={isFirstPage}></lightning-button>
                    <span class="slds-m-horizontal_small">Trang {pageNumber}</span>
                    <lightning-button label="Trang sau" onclick={nextPage} disabled={isLastPage}></lightning-button>
                </div>

                <template lwc:if={detail}>
                    <div class="slds-box slds-m-top_medium">
                        <p>Yêu cầu <b>{detail.requestNumber}</b> – {detail.statusLabel}</p>
                        <ul class="slds-list_dotted slds-m-top_x-small">
                            <template for:each={detail.history} for:item="h">
                                <li key={h.key}>{h.changedAt} – {h.statusLabel}</li>
                            </template>
                        </ul>
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
